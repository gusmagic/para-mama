<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa Mamá!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            text-align: center;
            overflow: hidden;
        }
        #contenedor {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #d63384; font-size: 24px; }
        .botones { margin-top: 20px; position: relative; height: 60px; }
        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            transition: 0.3s;
        }
        #btnSi { background-color: #ff69b4; color: white; }
        #btnNo {
            background-color: #6c757d;
            color: white;
            position: absolute;
        }
        .oculto { display: none; }
        img { width: 100%; border-radius: 15px; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="contenedor">
        <div id="pregunta">
            <h1>¿Eres la mejor mamá del mundo? ❤️</h1>
            <div class="botones">
                <button id="btnSi">¡SÍ!</button>
                <button id="btnNo">No</button>
            </div>
        </div>

        <div id="mensajeFinal" class="oculto">
            <h1>feliz día de la mamá mamis.</h1>
            <p>gracias por todo mamis te quiero mucho</p>
            <img src="nuestra_foto.jpg" alt="Nosotros">
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btnSi');
        const btnNo = document.getElementById('btnNo');
        const pregunta = document.getElementById('pregunta');
        const mensajeFinal = document.getElementById('mensajeFinal');

        function moverBoton() {
            const x = Math.random() * (window.innerWidth - btnNo.clientWidth);
            const y = Math.random() * (window.innerHeight - btnNo.clientHeight);
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        btnNo.addEventListener('mouseover', moverBoton);
        btnNo.addEventListener('touchstart', moverBoton);

        btnSi.addEventListener('click', () => {
            pregunta.classList.add('oculto');
            mensajeFinal.classList.remove('oculto');
            document.body.style.backgroundColor = "#ffc0cb";
        });
    </script>
</body>
</html>
